plugins {
    id 'java-library'
    id 'application'
    id 'net.hasor.boot'
}

dependencies {
    implementation "net.hasor:hasor-core:${property('lib.hasor')}"
    runtimeOnly 'org.slf4j:slf4j-simple:1.7.30'
}

application {
    mainClass = 'net.hasor.demo.boot.DemoHasorBootApplication'
}

tasks.named('bootJar') {
    mainClass = application.mainClass
    loaderClasspath.from(configurations.detachedConfiguration(dependencies.create("net.hasor:hasor-boot-loader:${project.property('lib.hasor')}")))
}
