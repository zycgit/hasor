plugins {
    id 'java-library'
    id 'maven-publish'
}

ext.pomName = 'Hasor-Core'
description = 'Hasor IoC and application framework core.'

configurations {
    shaded
}

dependencies {
    api "org.slf4j:slf4j-api:${property('lib.slf4j')}"
    api "net.hasor:cobble-all:${property('lib.cobble')}"
    api "javax.annotation:javax.annotation-api:${property('lib.annotation')}"
    shaded "javax.inject:javax.inject:${property('lib.inject')}"

    compileOnly "javax.inject:javax.inject:${property('lib.inject')}"
}

tasks.named('jar') {
    from { configurations.shaded.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
