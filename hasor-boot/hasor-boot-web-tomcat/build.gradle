plugins {
    id 'java-library'
    id 'maven-publish'
}

ext.pomName = 'Hasor-Boot-Web-Tomcat'
description = 'Hasor Boot Web embedded Tomcat server.'

dependencies {
    api project(':hasor-boot-web')
    api "org.apache.tomcat.embed:tomcat-embed-core:9.0.83"

    testImplementation project(':test-web-containers')
    testRuntimeOnly 'com.google.code.gson:gson:2.14.0'
}
